# AgriLink mount: the Kabila hosted-verification app served under /kyc/
# (copied verbatim by Dockerfile.agrilink). The portal's Caddy/nginx routes
# /kyc/* here.
#
# The React bundle is built with Vite base /kyc/ so assets and client-side
# routes (/kyc/verify/mobile, /kyc/user-verification, /kyc/qr) resolve
# correctly. The app calls the API same-origin at /kyc/api/... which we
# strip and proxy to kyc-api:3001 - no CORS, no key in the browser (public
# clients authenticate with X-Handoff-Token / X-Session-Token).
#
# nginx location precedence: exact (=) > prefix ^~ > regex (~) > prefix.
# The API regex therefore wins for /kyc/api/...; everything else under
# /kyc/ falls through to the SPA/alias block, which serves hashed assets
# directly and falls back to index.html for client-side routes.

# TLS terminates at Caddy; pass its X-Forwarded-Proto through so kyc-api
# builds https:// links, and fall back to our own scheme when absent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Static upstream group. nginx resolves "kyc-api" ONCE at startup through
# the container's resolv.conf (Docker's embedded DNS) - the same behaviour
# as the portal's own `proxy_pass http://api:8000;` / `http://kyc-web:8080;`.
#
# WHY THIS EXISTS - the previous config proxied with
#     proxy_pass http://kyc-api:3001/$2$is_args$args;
# As soon as proxy_pass contains a variable nginx defers hostname lookup to
# request time and REQUIRES a `resolver` directive. None was configured, so
# every /kyc/api/* call the phone made died inside kyc-web with
# "502 Bad Gateway" ("no resolver defined to resolve kyc-api" in the nginx
# error log) and never reached kyc-api. The wizard rendered that 502 as
# "Unable to Load - Invalid or unrecognised link", while the portal's own
# server-to-server status polls (which hit kyc-api:3001 directly) kept
# returning 200. Referencing a named upstream needs no resolver at all.
upstream kyc_api {
    server kyc-api:3001;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # ── API + media, with or without the /kyc prefix ────────────────────
    # Hosted-flow endpoints actually used:
    #   /api/v2/verify/*       initialize, step uploads, status, media
    #   /api/verify/handoff/*  mobile handoff create/session/status/link
    #   /api/public/assets/*   stored capture media
    #   /api/files/*           local-storage captures (API-key auth)
    #   /api/health            health
    #
    # /kyc/api/... -> strip the mount prefix with `rewrite … break`, then
    # proxy. proxy_pass has NO URI part and NO variables, so nginx forwards
    # the (rewritten) request URI verbatim - query string included - and
    # resolves the upstream at startup, not per request. Plain /api/...
    # (no prefix) does not match the rewrite and is forwarded unchanged.
    #
    # NOTE: this block must stay ABOVE the static-file regex below - regex
    # locations are tried in file order, and /kyc/api/public/assets/x.png
    # must reach the API, not the filesystem.
    location ~ ^/(?:kyc/)?api/ {
        rewrite ^/kyc(/api/.*)$ $1 break;
        proxy_pass http://kyc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Tell the API it is mounted under /kyc so absolute link/redirect
        # targets (verification_url, hosted_url) keep the prefix instead of
        # pointing at the portal root (404).
        proxy_set_header X-Forwarded-Prefix /kyc;
        # Strip Origin - same-origin by definition, avoids CORS config.
        proxy_set_header Origin "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ── Static non-API files (favicons, public assets, built js/css) ─────
    # Regex locations outrank the SPA prefix, so /kyc/agrilink/plant.svg and
    # /kyc/assets/*.js are served as real files (404 when missing) rather
    # than falling back to index.html; index.html still hits the SPA block.
    location ~* ^/kyc/(?<f>.+\.(?:svg|png|ico|jpg|jpeg|webp|gif|js|css|woff2?|ttf|eot|webmanifest|txt|xml))$ {
        root /usr/share/nginx/html;
        try_files /$f =404;
    }

    # ── SPA + client-side routes ────────────────────────────────────────
    # /kyc/verify/mobile, /kyc/user-verification … all resolve from the
    # bundle root; missing files fall back to index.html.
    location = /kyc {
        return 301 /kyc/;
    }
    location /kyc/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /kyc/index.html;
        # Only the entry document reaches this block (hashed assets are
        # served by the regex above). Never let phones cache it, or a
        # rebuilt kyc-web keeps serving links to bundles that no longer exist.
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        return 302 /kyc/;
    }
}
